<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zyqraile — Free & Open Source Ekosystém</title>
    <meta name="description" content="Zyqraile is a modern free and open-source web ecosystem. Putting Customers First, Revenue Second.">
    <meta name="keywords" content="Zyqraile, open source, software, web ecosystem, development">
    <meta name="author" content="Zyqraile LLC">
    <link rel="icon" type="image/png" href="./media/logo.png">
    <style>
        :root {
            --bg-color: #0b0f19;
            --card-bg: #111827;
            --text-main: #f3f4f6;
            --text-muted: #9ca3af;
            --accent: #38bdf8;
            --accent-hover: #0ea5e9;
        }
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            line-height: 1.6;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }
        header {
            padding: 2rem 5%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #1f2937;
        }
        .logo {
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--text-main);
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }
        .logo span {
            color: var(--accent);
        }
        main {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 4rem 5%;
        }
        h1 {
            font-size: 3rem;
            margin-bottom: 1rem;
            letter-spacing: -0.025em;
        }
        h1 span {
            background: linear-gradient(to right, #38bdf8, #818cf8);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .tagline {
            font-size: 1.25rem;
            color: var(--text-muted);
            max-width: 600px;
            margin-bottom: 2.5rem;
        }
        .cta-container {
            display: flex;
            gap: 1rem;
            flex-wrap: wrap;
            justify-content: center;
        }
        .btn {
            background-color: var(--accent);
            color: #0b0f19;
            padding: 0.75rem 1.5rem;
            border-radius: 0.375rem;
            font-weight: 600;
            text-decoration: none;
            transition: background-color 0.2s;
        }
        .btn:hover {
            background-color: var(--accent-hover);
        }
        .btn-outline {
            background-color: transparent;
            color: var(--text-main);
            border: 1px solid #374151;
        }
        .btn-outline:hover {
            background-color: #1f2937;
        }
        footer {
            padding: 1.5rem 5%;
            text-align: center;
            color: var(--text-muted);
            font-size: 0.875rem;
            border-top: 1px solid #1f2937;
        }
    </style>
</head>
<body>

    <header>
        <a href="#" class="logo">Zyqraile<span>.</span></a>
    </header>

    <main>
        <h1>Moderní webový ekosystém <span>v1</span></h1>
        <p class="tagline">Putting Customers First, Revenue Second. Svobodný open-source projekt pro každého.</p>
        
        <div class="cta-container">
            <a href="https://github.com/Zyqraile" target="_blank" class="btn">Prozkoumat GitHub</a>
            <a href="#about" class="btn btn-outline">O projektu</a>
        </div>
    </main>

    <footer>
        <p>&copy; 2026 Zyqraile Community. Open Source pod MIT licencí.</p>
    </footer>

</body>
</html>
