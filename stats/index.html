<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <!-- SEO & Metadata -->
    <title>Zyqraile Stats — System Status</title>
    <meta name="description" content="Aktuální stav služeb ekosystému Zyqraile.">
    
    <!-- Favicon -->
    <link rel="icon" type="image/png" href="https://zyqraile.pages.dev/media/logo.png">

    <!-- Apple-grade Minimalist Styling -->
    <style>
        :root {
            --bg-obsidian: #000000;
            --card-bg: rgba(22, 22, 23, 0.8);
            --border-color: rgba(255, 255, 255, 0.1);
            --cyan: #00F0FF;
            --indigo: #6366F1;
            --white: #F5F5F7;
            --gray: #86868B;
            --green: #30D158;
            --red: #FF453A;
        }

        * {
            box-sizing: border-box;
            -webkit-font-smoothing: antialiased;
        }

        body {
            background-color: var(--bg-obsidian);
            color: var(--white);
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            margin: 0;
            padding: 60px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            width: 100%;
            max-width: 680px;
            animation: fadeIn 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        header {
            text-align: center;
            margin-bottom: 50px;
        }

        h1 {
            font-size: 2.8rem;
            font-weight: 600;
            letter-spacing: -0.015em;
            margin: 0 0 12px 0;
            background: linear-gradient(135deg, #FFFFFF 0%, #A1A1A6 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .subtitle {
            color: var(--gray);
            font-size: 1.1rem;
            font-weight: 400;
            letter-spacing: -0.006em;
        }

        .card {
            background-color: var(--card-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-radius: 18px;
            padding: 24px 28px;
            margin-bottom: 24px;
            border: 1px solid var(--border-color);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
        }

        h2 {
            font-size: 1.1rem;
            font-weight: 500;
            color: var(--white);
            letter-spacing: -0.01em;
            margin: 0 0 16px 0;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .status-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 14px 0;
            border-bottom: 1px solid rgba(255, 255, 255, 0.06);
        }

        .status-item:last-child {
            border-bottom: none;
            padding-bottom: 0;
        }

        .status-item:first-of-type {
            padding-top: 0;
        }

        .service-name {
            font-weight: 400;
            font-size: 0.95rem;
            color: var(--white);
        }

        .status-badge {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 0.85rem;
            font-weight: 500;
        }

        .dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
        }

        .dot.operational { background-color: var(--green); box-shadow: 0 0 10px rgba(48, 209, 88, 0.4); }
        .dot.outage { background-color: var(--red); box-shadow: 0 0 10px rgba(255, 69, 58, 0.4); }

        .info-text {
            color: var(--gray);
            font-size: 0.95rem;
            line-height: 1.5;
            margin: 6px 0;
        }

        .info-title {
            color: var(--white);
            font-weight: 500;
            font-size: 0.95rem;
            margin: 0 0 4px 0;
        }

        .tag {
            display: inline-block;
            background-color: rgba(99, 102, 241, 0.15);
            color: var(--cyan);
            padding: 4px 10px;
            border-radius: 6px;
            font-size: 0.75rem;
            font-weight: 600;
            letter-spacing: 0.03em;
            text-transform: uppercase;
            margin-bottom: 10px;
            border: 1px solid rgba(99, 102, 241, 0.3);
        }

        .update-block {
            margin-bottom: 16px;
        }
        .update-block:last-child {
            margin-bottom: 0;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <h1>Zyqraile Stats</h1>
            <div class="subtitle">"Putting Customers First, Revenue Second."</div>
        </header>

        <!-- Sekce: Stav služeb -->
        <div class="card">
            <h2>System Status</h2>
            <div id="services-list">
                <p class="info-text">Načítám stavy služeb...</p>
            </div>
        </div>

        <!-- Sekce: Plánovaná údržba -->
        <div class="card">
            <h2>Scheduled Maintenance</h2>
            <div id="maintenance-list">
                <p class="info-text">Žádná plánovaná údržba.</p>
            </div>
        </div>

        <!-- Sekce: Nové funkce -->
        <div class="card">
            <h2>Latest Updates</h2>
            <div id="updates-list">
                <p class="info-text">Načítám novinky...</p>
            </div>
        </div>
    </div>

    <!-- Skript pro načtení dat -->
    <script>
        async function loadStatusData() {
            try {
                // Načtení stavu služeb
                const statusRes = await fetch('status.json');
                const statusData = await statusRes.json();
                const servicesDiv = document.getElementById('services-list');
                servicesDiv.innerHTML = '';
                
                statusData.services.forEach(service => {
                    const isOperational = service.status === 'operational';
                    servicesDiv.innerHTML += `
                        <div class="status-item">
                            <span class="service-name">${service.name}</span>
                            <div class="status-badge">
                                <span class="dot ${isOperational ? 'operational' : 'outage'}"></span>
                                <span style="color: ${isOperational ? 'var(--green)' : 'var(--red)'};">
                                    ${isOperational ? 'Operational' : 'Outage'}
                                </span>
                            </div>
                        </div>
                    `;
                });

                // Načtení údržby
                const maintRes = await fetch('maintenance.json');
                const maintData = await maintRes.json();
                const maintDiv = document.getElementById('maintenance-list');
                if (maintData.maintenance) {
                    maintDiv.innerHTML = `
                        <div class="tag">${maintData.maintenance.date}</div>
                        <p class="info-title">${maintData.maintenance.title}</p>
                        <p class="info-text">${maintData.maintenance.description}</p>
                    `;
                }

                // Načtení novinek
                const updateRes = await fetch('update.json');
                const updateData = await updateRes.json();
                const updateDiv = document.getElementById('updates-list');
                updateDiv.innerHTML = '';
                updateData.features.forEach(feat => {
                    updateDiv.innerHTML += `
                        <div class="update-block">
                            <p class="info-title">✨ ${feat.title}</p>
                            <p class="info-text">${feat.description}</p>
                        </div>
                    `;
                });

            } catch (error) {
                console.error('Chyba při načítání dat:', error);
            }
        }

        loadStatusData();
    </script>

</body>
</html>
