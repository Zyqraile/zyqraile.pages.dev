<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <!-- SEO & Metadata -->
    <title>Zyqraile Stats | System Status</title>
    <meta name="description" content="Aktuální stav služeb ekosystému Zyqraile.">
    
    <!-- Favicon -->
    <link rel="icon" type="image/png" href="https://zyqraile.pages.dev/media/logo.png">

    <!-- Design a styly v barvách Zyqraile -->
    <style>
        :root {
            --bg-obsidian: #0B0F19;
            --card-bg: #121826;
            --cyan: #00F0FF;
            --indigo: #6366F1;
            --white: #FFFFFF;
            --gray: #94A3B8;
            --green: #10B981;
            --red: #EF4444;
        }

        body {
            background-color: var(--bg-obsidian);
            color: var(--white);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 40px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .container {
            width: 100%;
            max-width: 700px;
        }

        header {
            text-align: center;
            margin-bottom: 40px;
        }

        h1 {
            color: var(--cyan);
            font-size: 2.2rem;
            margin: 0 0 10px 0;
        }

        .subtitle {
            color: var(--gray);
            font-size: 1rem;
        }

        .card {
            background-color: var(--card-bg);
            border-radius: 12px;
            padding: 20px 25px;
            margin-bottom: 20px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        h2 {
            font-size: 1.2rem;
            color: var(--white);
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            padding-bottom: 10px;
            margin-top: 0;
        }

        .status-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 0;
            border-bottom: 1px solid rgba(255, 255, 255, 0.03);
        }

        .status-item:last-child {
            border-bottom: none;
        }

        .service-name {
            font-weight: 600;
            color: var(--white);
        }

        .status-badge {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 0.9rem;
            font-weight: bold;
        }

        .dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
        }

        .dot.operational { background-color: var(--green); box-shadow: 0 0 8px var(--green); }
        .dot.outage { background-color: var(--red); box-shadow: 0 0 8px var(--red); }

        .info-text {
            color: var(--gray);
            font-size: 0.95rem;
            margin: 8px 0;
        }

        .tag {
            display: inline-block;
            background-color: var(--indigo);
            color: var(--white);
            padding: 3px 10px;
            border-radius: 6px;
            font-size: 0.8rem;
            font-weight: bold;
            margin-bottom: 8px;
        }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <h1>Zyqraile Stats</h1>
            <div class="subtitle">"Putting Customers First, Revenue Second."</div>
        </header>

        <!-- Sekce: Stav služeb -->
        <div class="card">
            <h2>System Status</h2>
            <div id="services-list">
                <p class="info-text">Načítám stavy služeb...</p>
            </div>
        </div>

        <!-- Sekce: Plánovaná údržba -->
        <div class="card">
            <h2>Scheduled Maintenance</h2>
            <div id="maintenance-list">
                <p class="info-text">Žádná plánovaná údržba.</p>
            </div>
        </div>

        <!-- Sekce: Nové funkce -->
        <div class="card">
            <h2>Latest Updates & Features</h2>
            <div id="updates-list">
                <p class="info-text">Načítám novinky...</p>
            </div>
        </div>
    </div>

    <!-- Skript pro načtení dat z JSON souborů -->
    <script>
        async function loadStatusData() {
            try {
                // Načtení stavu služeb
                const statusRes = await fetch('status.json');
                const statusData = await statusRes.json();
                const servicesDiv = document.getElementById('services-list');
                servicesDiv.innerHTML = '';
                
                statusData.services.forEach(service => {
                    const isOperational = service.status === 'operational';
                    servicesDiv.innerHTML += `
                        <div class="status-item">
                            <span class="service-name">${service.name}</span>
                            <div class="status-badge">
                                <span class="dot ${isOperational ? 'operational' : 'outage'}"></span>
                                <span style="color: ${isOperational ? 'var(--green)' : 'var(--red)'};">
                                    ${isOperational ? 'Operational' : 'Outage'}
                                </span>
                            </div>
                        </div>
                    `;
                });

                // Načtení údržby
                const maintRes = await fetch('maintenance.json');
                const maintData = await maintRes.json();
                const maintDiv = document.getElementById('maintenance-list');
                if (maintData.maintenance) {
                    maintDiv.innerHTML = `
                        <div class="tag">${maintData.maintenance.date}</div>
                        <p class="info-text"><strong>${maintData.maintenance.title}</strong></p>
                        <p class="info-text">${maintData.maintenance.description}</p>
                    `;
                }

                // Načtení novinek
                const updateRes = await fetch('update.json');
                const updateData = await updateRes.json();
                const updateDiv = document.getElementById('updates-list');
                updateDiv.innerHTML = '';
                updateData.features.forEach(feat => {
                    updateDiv.innerHTML += `
                        <p class="info-text">✨ <strong>${feat.title}</strong> – ${feat.description}</p>
                    `;
                });

            } catch (error) {
                console.error('Chyba při načítání dat:', error);
            }
        }

        loadStatusData();
    </script>

</body>
</html>
